<div class="container mt-4">
  <div class="card">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label for="fileInput" class="form-label">Escolha uma imagem</label>
          <input
            type="file"
            id="fileInput"
            class="form-control"
            accept="image/*"
            (change)="onFileSelected($event)"
            [disabled]="uploading()"
          />
        </div>
        @if (previewUrl()) {
          <div class="text-center">
            <img
              [src]="previewUrl()"
              class="img-thumbnail rounded mb-3 w-25"
              alt="Preview da imagem"
            />
          </div>
        }

        <button
          type="button"
          class="btn btn-primary w-100"
          [disabled]="!selectedFile() || uploading()"
          (click)="sendUpload()"
        >
          @if (uploading()) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Enviando...
          } @else {
            Enviar para o bucket
          }
        </button>

        @if (mensagem()) {
          <div
            class="alert mt-3"
            [class.alert-success]="mensagem().includes('sucesso')"
            [class.alert-danger]="!mensagem().includes('sucesso')"
          >
            {{ mensagem() }}
          </div>
        }
      </form>
      <br>
      <br>
      <div class="container">
        <h4 class="mb-3">Galeria</h4>

        @if (photos().length === 0) {
          <p class="text-muted">Nenhuma imagem enviada ainda.</p>
        }

        <div class="row row-cols-2 row-cols-md-4 g-3">
          @for (photo of photos(); track photo.key) {
            <div class="col">
              <div class="card h-100">
                <img
                  [src]="photo.url"
                  class="card-img-top"
                  [alt]="photo.key"
                  style="object-fit: cover; height: 150px"
                />
              </div>
            </div>
          }
        </div>
      </div>
    </div>
  </div>
</div>
