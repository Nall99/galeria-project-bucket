<div class="container mt-4">
  <div class="card">
    <div class="card-body">
      <form>
        <div class="mb-3">
          <label for="fileInput" class="form-label">Escolha uma imagem</label>
          <input
            type="file"
            id="fileInput"
            class="form-control"
            accept="image/*"
            (change)="onFileSelected($event)"
            [disabled]="uploading()"
          />
        </div>
        @if (previewUrl()) {
          <img [src]="previewUrl()" class="img-fluid rounded mb-3" alt="Preview da imagem" />
        }

        <button
          type="button"
          class="btn btn-primary w-100"
          [disabled]="!selectedFile() || uploading()"
          (click)="sendUpload()"
        >
          @if (uploading()) {
            <span class="spinner-border spinner-border-sm me-2" role="status"></span>
            Enviando...
          } @else {
            Enviar para o bucket
          }
        </button>

        @if (mensagem()) {
          <div
            class="alert mt-3"
            [class.alert-success]="mensagem().includes('sucesso')"
            [class.alert-danger]="!mensagem().includes('sucesso')"
          >
            {{ mensagem() }}
          </div>
        }
      </form>
    </div>
  </div>
</div>
